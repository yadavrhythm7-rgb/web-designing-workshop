<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Table</title>
</head>

<body>
    <table border="1" cellpadding="8">
        <tr>
            <th>Day</th>
            <th>Lab Batches</th>
            <th>Faculty</th>
            <th>Room</th>
            <th>Time</th>
        </tr>
        <tr>
            <th>Friday</th>
            <td>
                <table border="1" cellpadding="6">
                    <tr>
                        <th>Batch</th>
                        <th>System</th>
                    </tr>
                    <tr>
                        <td>A1</td>
                        <td>PC 1-20</td>
                    </tr>
                    <tr>
                        <td>A2</td>
                        <td>PC 21-40</td>
                    </tr>
                </table>
            </td>
            <td>Dr. Sharma</td>
            <td>Lab 2</td>
            <td>2-4 PM</td>
        </tr>
    </table>
</body>
</html>
