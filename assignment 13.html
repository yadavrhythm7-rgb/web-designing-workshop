<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Timetable</title>
</head>

<body>
    <table border="1" cellpadding="8">
        <h1 align>Weekly Timetable</h1>
        <thead>
            <tr>
                <th scope="col">Day</th>
                <th scope="col">9-10</th>
                <th scope="col">10-11</th>
                <th scope="col">11-12</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">Mon</th>
                <td>Maths</td>
                <td>HTML</td>
                <td rowspan="2">Web Development</td>
            </tr>
            <tr>
                <th scope="row">Tue</th>
                <td>DBMS</td>
                <td>OS</td>
            </tr>
            <tr>
                <th scope="row">Wed</th>
                <td colspan="3">Seminar</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
