<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College</title>
</head>

<body>
    <center>
        <header>
            <h1>ABES Engineering College Admission 2026</h1>
        </header>
        <section>
            <h2>Courses and Fees</h2>
            <p><b>Available Courses</b></p>
            <table border="2" cellpadding="7">
                <tr>
                    <th>Course</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
                <tr>
                    <td>B.Tech CSE </td>
                    <td>250</td>
                    <td>&#8377;1,81,200</td>
                </tr>
        
                <tr>
                    <td>BCA</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>
                </tr>
            </table>
        </section>
    </center>
        <section id="application">
            <form action="#" method="post">
                <fieldset>
                    <legend>Application Form</legend>
                    <label for="student-name">Name:</label><br>
                    <input type="text" id="student-name" name="student_name" required><br><br>
                    <label for="student-email">Email:</label><br>
                    <input type="email" id="student-email" name="email" required><br><br>
                    <label for="course-choice">Course:</label><br>
                    <select id="course-choice" name="course">
                        <option>B.Tech CSE </option>
                        <option>BCA</option>
                    </select><br><br>
                    <label for="statement">Statement:</label><br>
                    <textarea id="statement" name="statement" rows="4" cols="50" required></textarea><br><br>
                    <input type="submit" value="Apply">
                </fieldset>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 ABES Engineering College</p>
    </footer>
</body>

</html>
