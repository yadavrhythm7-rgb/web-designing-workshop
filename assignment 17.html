<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>
    <form action="#" method="post">
        <label for="full-name">Full Name:</label><br>
        <input type="text" id="full-name" name="full_name" placeholder="Enter your full name" required><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="you@college.edu" required><br><br>
        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile" maxlength="10"
            title="Enter exactly 10 digits" required><br><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Min 6 characters" minlength="6"
            required><br><br>
        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" placeholder="Age (17-30)" min="17" max="30" required><br><br>
        <input type="submit" value="Register">
    </form>
</body>

</html>
